

name: Build GymPay APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q GymPayDemo-AndroidStudio-Project.zip -d source

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/GymPayDemo/app/build.gradle.kts")
          s = p.read_text()
          needle = '    buildFeatures { compose = true }\n'
          addition = '''    buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          '''
          if needle not in s:
              raise SystemExit("Could not find buildFeatures configuration")
          p.write_text(s.replace(needle, addition, 1))
          PY

      - name: Build APK
        run: gradle --no-daemon -p source/GymPayDemo :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GymPayDemo-APK
          path: source/GymPayDemo/app/build/outputs/apk/debug/app-debug.apk
